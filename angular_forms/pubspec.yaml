name: angular_forms
description: Forms framework for AngularDart.
repository: https://github.com/angulardart/angular
version: 4.0.1

environment:
  sdk: ^2.19.6

dependencies:
  angular: ^7.0.2
  meta: 1.9.1

dev_dependencies:
  angular_test: ^4.0.1
  build_resolvers: ">=2.0.0 <2.1.0"
  build_runner: ^2.3.3
  build_test: ^2.2.0
  build_web_compilers: ^3.2.7
  lints: ^2.0.1
  mockito: ^5.4.2
  test: ^1.24.3

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
