name: angular_forms
description: Forms framework for AngularDart.
repository: https://github.com/angulardart/angular
version: 4.1.0

environment:
  sdk: ^3.3.4

dependencies:
  angular: ^7.1.0
  meta: ^1.16.0

dev_dependencies:
  angular_test: ^4.1.0
  build_resolvers: ^2.4.2
  build_runner: ^2.4.9
  build_test: ^2.2.2
  build_web_compilers: ^4.0.10
  lints: ^4.0.0
  mockito: ^5.4.4
  test: ^1.25.5

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_test:
    path: ../angular_test
