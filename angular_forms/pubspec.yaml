name: angular_forms
description: Forms framework for AngularDart.
repository: https://github.com/angulardart/angular
version: 4.0.1

environment:
  sdk: 2.14.4

dependencies:
  angular: ^7.0.0
  meta: ^1.3.0

dev_dependencies:
  angular_test: ^4.0.0
  build_runner: ^2.0.0
  build_test: ^2.0.0
  build_web_compilers: ^3.0.0
  lints: 1.0.1
  mockito: ^5.0.0
  test: ^1.16.0

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
