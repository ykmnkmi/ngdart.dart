name: angular_test
description: Testing runner and library for AngularDart
repository: https://github.com/angulardart/angular
version: 4.1.0

environment:
  sdk: ^3.5.4

dependencies:
  angular: ^7.1.0
  collection: ^1.19.1
  meta: ^1.18.1

dev_dependencies:
  build_resolvers: ^2.4.2
  build_runner: ^2.4.13
  build_test: ^2.2.2
  build_web_compilers: ^4.0.11
  lints: ^5.0.0
  test: ^1.26.3

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
