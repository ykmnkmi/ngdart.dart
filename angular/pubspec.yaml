name: angular
description: >-
  Fast and productive web framework by Google.
  Separate, but similar to the JavaScript framework with a similar name.
version: 7.0.2
repository: https://github.com/angulardart/angular

environment:
  sdk: 2.15.1

dependencies:
  angular_compiler: ^2.0.2
  build: ^2.3.0
  built_collection: ^5.1.1
  built_value: ^8.8.0
  collection: ^1.17.0
  intl: ^0.17.0
  js: ^0.6.3
  lints: ^1.0.1
  meta: ">=1.9.1 <1.10.0"

dependency_overrides:
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
