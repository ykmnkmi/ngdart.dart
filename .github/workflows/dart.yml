        working-directory: angular_forms
      - id: angular_forms_test_ci_j1
        name: "angular_forms; dart run build_runner test --fail-on-severe -- -P ci -j1"
        run: dart run build_runner test --fail-on-severe -- -P ci -j1
        if: "always() && steps.angular_forms_build.conclusion == 'success'"
        working-directory: angular_forms

  angular_router:
    name: "angular_router"
    needs: angular_test
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_router"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_router
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: angular_router_pub_upgrade
        name: angular_router; dart pub upgrade
        run: dart pub upgrade
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: angular_router
      - id: angular_router_analyze
        name: "angular_router; dart analyze"
        run: dart analyze
        if: "always() && steps.angular_router_pub_upgrade.conclusion == 'success'"
        working-directory: angular_router
      - id: angular_router_build
        name: "angular_router; dart run build_runner build --fail-on-severe"
        run: dart run build_runner build --fail-on-severe
        if: "always() && steps.angular_router_analyze.conclusion == 'success'"
        working-directory: angular_router
      - id: angular_router_test_ci_j1
        name: "angular_router; dart run build_runner test --fail-on-severe -- -P ci -j1"
        run: dart run build_runner test --fail-on-severe -- -P ci -j1
        if: "always() && steps.angular_router_build.conclusion == 'success'"
        working-directory: angular_router

  _tests:
    name: "_tests"
    needs:
      - angular_forms
      - angular_router
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:_tests"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:_tests
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: _tests_pub_upgrade
        name: _tests; dart pub upgrade
