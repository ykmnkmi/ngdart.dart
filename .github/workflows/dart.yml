name: Dart CI
on:
  push:
    branches:
      - v8html
      - master
  pull_request:
    branches:
      - v8html
      - master
defaults:
  run:
    shell: bash
env:
  PUB_ENVIRONMENT: bot.github
permissions: read-all

jobs:
  angular_ast:
    name: "angular_ast"
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_ast"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_ast
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: angular_ast_pub_upgrade
        name: angular_ast; dart pub upgrade
        run: dart pub upgrade
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: angular_ast
      - id: angular_ast_analyze
        name: "angular_ast; dart analyze"
        run: dart analyze
        if: "always() && steps.angular_ast_pub_upgrade.conclusion == 'success'"
        working-directory: angular_ast
      - id: angular_ast_test_ci
        name: "angular_ast; dart test -P ci"
        run: dart test -P ci
        if: "always() && steps.angular_ast_analyze.conclusion == 'success'"
        working-directory: angular_ast

  angular_compiler:
    name: "angular_compiler"
    needs: angular_ast
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_compiler"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_compiler
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: angular_compiler_pub_upgrade
        name: angular_compiler; dart pub upgrade
        run: dart pub upgrade
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: angular_compiler
      - id: angular_compiler_analyze
        name: "angular_compiler; dart analyze"
        run: dart analyze
        if: "always() && steps.angular_compiler_pub_upgrade.conclusion == 'success'"
        working-directory: angular_compiler
      - id: angular_compiler_test_ci
        name: "angular_compiler; dart test -P ci"
        run: dart test -P ci
        if: "always() && steps.angular_compiler_analyze.conclusion == 'success'"
        working-directory: angular_compiler

  angular:
    name: "angular"
    needs: angular_compiler
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: angular_pub_upgrade
        name: angular; dart pub upgrade
        run: dart pub upgrade
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: angular
      - id: angular_analyze
        name: "angular; dart analyze"
        run: dart analyze
        if: "always() && steps.angular_pub_upgrade.conclusion == 'success'"
        working-directory: angular

  angular_test:
    name: "angular_test"
    needs: angular
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_test"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_test
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: angular_test_pub_upgrade
        name: angular_test; dart pub upgrade
        run: dart pub upgrade
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: angular_test
      - id: angular_test_analyze
        name: "angular_test; dart analyze"
        run: dart analyze
        if: "always() && steps.angular_test_pub_upgrade.conclusion == 'success'"
        working-directory: angular_test
      - id: angular_test_build
        name: "angular_test; dart run build_runner build --fail-on-severe"
        run: dart run build_runner build --fail-on-severe
        if: "always() && steps.angular_test_analyze.conclusion == 'success'"
        working-directory: angular_test
      - id: angular_test_test_ci_j1
        name: "angular_test; dart run build_runner test --fail-on-severe -- -P ci -j1"
        run: dart run build_runner test --fail-on-severe -- -P ci -j1
        if: "always() && steps.angular_test_build.conclusion == 'success'"
        working-directory: angular_test

  angular_forms:
    name: "angular_forms"
    needs: angular_test
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@v4
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_forms"
          restore-keys: |
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5;packages:angular_forms
            os:ubuntu-latest;pub-cache-hosted;sdk:3.1.5
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.1.5"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
      - id: angular_forms_pub_upgrade
        name: angular_forms; dart pub upgrade
        run: dart pub upgrade
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: angular_forms
      - id: angular_forms_analyze
        name: "angular_forms; dart analyze"
        run: dart analyze
        if: "always() && steps.angular_forms_pub_upgrade.conclusion == 'success'"
        working-directory: angular_forms
      - id: angular_forms_build
