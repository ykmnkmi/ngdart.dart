        working-directory: _tests
      - id: _tests_test_vm
        name: "_tests; dart test -P vm"
        run: dart test -P vm
        if: "always() && steps._tests_test_browser.conclusion == 'success'"
        working-directory: _tests

  tests:
    name: "tests"
    needs: angular_test
