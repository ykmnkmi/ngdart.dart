name: angular_router
repository: https://github.com/angulardart/angular
description: Router for AngularDart.
version: 3.0.1

environment:
  sdk: 2.16.2

dependencies:
  angular: ^7.0.2
  collection: ^1.17.0
  js: ^0.6.5
  meta: ">=1.9.1 <1.10.0"

dev_dependencies:
  angular_test: ^4.0.1
  async: ^2.9.0
  build_runner: ">=2.2.0 <2.2.1"
  build_test: ^2.1.5
  build_web_compilers: ^3.2.3
  lints: ^1.0.1
  mockito: ^5.2.0
  test: ">=1.21.4 <1.21.5"

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
