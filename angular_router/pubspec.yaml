name: angular_router
repository: https://github.com/angulardart/angular
description: Router for AngularDart.
version: 3.1.0

environment:
  sdk: ^3.1.5

dependencies:
  angular: ^7.1.0
  collection: ^1.18.0
  js: ^0.7.0
  meta: ^1.16.0

dev_dependencies:
  angular_test: ^4.1.0
  async: ^2.11.0
  build_resolvers: ^2.4.2
  build_runner: ^2.4.9
  build_test: ^2.2.2
  build_web_compilers: ^4.0.10
  lints: ^2.1.1
  mockito: ^5.4.4
  pedantic: ^1.11.1
  test: ^1.25.5

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_test:
    path: ../angular_test
