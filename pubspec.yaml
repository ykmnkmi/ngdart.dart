name: angular_workspace
description: AngularDart workspace.
environment:
  sdk: ^3.4.4

dependencies:
  angular: ^7.1.0
  angular_ast: ^2.1.0
  angular_compiler: ^2.1.0
  angular_forms: ^4.1.0
  angular_test: ^4.1.0

dev_dependencies:
  lints: ^4.0.0

dependency_overrides:
  angular:
    path: angular
  angular_ast:
    path: angular_ast
  angular_compiler:
    path: angular_compiler
  angular_forms:
    path: angular_forms
  angular_router:
    path: angular_router
  angular_test:
    path: angular_test
