name: angular_compiler
repository: https://github.com/angulardart/angular
description: Compiler for AngularDart.
version: 2.1.0

environment:
  sdk: ^3.1.5

dependencies:
  analyzer: 6.2.0
  angular: ^7.1.0
  angular_ast: ^2.1.0
  args: ^2.5.0
  build: ^2.4.1
  build_test: ^2.2.2
  code_builder: ^4.10.0
  collection: ^1.18.0
  csslib: ^1.0.2
  dart_style: ^2.3.6
  logging: ^1.2.0
  matcher: ^0.12.16+1
  meta: ^1.10.0
  package_config: ^2.1.0
  path: ^1.9.0
  source_gen: ^1.5.0
  source_span: ^1.10.2
  stack_trace: ^1.11.1

dev_dependencies:
  build_resolvers: ^2.4.2
  build_runner: ^2.4.9
  mockito: ^5.4.4
  lints: ^2.1.1
  test: ^1.25.5

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
