name: angular_compiler
repository: https://github.com/angulardart/angular
description: Compiler for AngularDart.
version: 2.0.2

environment:
  sdk: 2.15.1

dependencies:
  analyzer: ^3.4.1
  angular: ^7.0.2
  angular_ast: ^2.0.1
  args: ^2.3.1
  build: ^2.3.0
  build_test: ^2.1.5
  code_builder: ^4.1.0
  collection: ^1.17.0
  csslib: ^0.17.2
  dart_style: ^2.2.3
  logging: ^1.1.0
  matcher: ^0.12.12
  meta: ">=1.9.1 <1.10.0"
  package_config: ^2.1.0
  path: ^1.8.3
  source_gen: ^1.2.2
  source_span: ^1.9.1
  stack_trace: ^1.10.0

dev_dependencies:
  build_runner: ^2.2.0
  mockito: ^5.2.0
  lints: ^1.0.1
  test: ">=1.21.4 <1.21.5"

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
