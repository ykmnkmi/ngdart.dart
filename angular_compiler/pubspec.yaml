name: angular_compiler
repository: https://github.com/angulardart/angular
description: Compiler for AngularDart.
version: 2.0.2

environment:
  sdk: ^2.19.6

dependencies:
  analyzer: 5.8.0
  angular: ^7.0.2
  angular_ast: ^2.0.1
  args: ^2.4.2
  build: ^2.3.1
  build_test: ^2.2.0
  code_builder: ^4.7.0
  collection: ^1.18.0
  csslib: ^1.0.0
  dart_style: ^2.3.1
  logging: ^1.2.0
  matcher: ^0.12.15
  meta: 1.9.1
  package_config: ^2.1.0
  path: ^1.8.3
  source_gen: ^1.3.2
  source_span: ^1.10.0
  stack_trace: ^1.11.1

dev_dependencies:
  build_resolvers: ">=2.0.0 <2.1.0"
  build_runner: ^2.3.3
  mockito: ^5.4.0
  lints: ^2.0.1
  test: ^1.24.2

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
