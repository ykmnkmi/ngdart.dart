name: angular_compiler
repository: https://github.com/angulardart/angular
description: Compiler for AngularDart.
version: 2.1.0

environment:
  sdk: ^3.4.4

dependencies:
  analyzer: ^6.5.0
  angular: ^7.1.0
  angular_ast: ^2.1.0
  args: ^2.7.0
  build: ^2.4.1
  build_test: ^2.2.2
  code_builder: ^4.10.0
  collection: ^1.19.1
  csslib: ^1.0.2
  dart_style: ^2.3.7
  logging: ^1.3.0
  matcher: ^0.12.16+1
  meta: ^1.16.0
  package_config: ^2.2.0
  path: ^1.9.1
  source_gen: ^1.5.0
  source_span: ^1.10.2
  stack_trace: ^1.12.1

dev_dependencies:
  build_resolvers: ^2.4.2
  build_runner: ^2.4.11
  mockito: ^5.4.4
  lints: ^4.0.0
  test: ^1.25.8

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
