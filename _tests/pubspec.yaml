name: _tests
description: Tests for AngularDart.

environment:
  sdk: ^2.19.6

dependencies:
  angular: ^7.0.2
  angular_compiler: ^2.0.2
  angular_test: ^4.0.1
  build: ^2.3.1
  build_resolvers: ">=2.4.0 <2.4.1"
  build_test: ^2.2.1
  collection: ^1.18.0
  glob: ^2.1.2
  meta: 1.9.1
  test: ^1.24.3

dev_dependencies:
  analyzer: 5.12.0
  angular_forms: ^4.0.1
  build_runner: ^2.3.3
  build_web_compilers:
  lints: ^2.0.1
  mockito: ^5.4.2
  package_config: ^2.1.0
  source_span: ^1.10.0
  term_glyph: ^1.2.1

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_forms:
    path: ../angular_forms
  angular_router:
    path: ../angular_router
  angular_test:
    path: ../angular_test
