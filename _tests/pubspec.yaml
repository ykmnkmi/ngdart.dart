name: _tests
description: Tests for AngularDart.

environment:
  sdk: 2.14.4

dependencies:
  angular:
  angular_test:
  build_resolvers: ^2.0.0
  collection: ^1.15.0
  meta: ^1.3.0
  test: ^1.16.0

dev_dependencies:
  analyzer: ^2.0.0
  angular_forms:
  build_runner: ^2.0.0
  build_test: ^2.0.0
  build_web_compilers:
  lints: 1.0.1
  mockito: ^5.0.0
  package_config: ^2.0.0
  source_span: ^1.8.0
  term_glyph: ^1.2.0

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_forms:
    path: ../angular_forms
  angular_router:
    path: ../angular_router
  angular_test:
    path: ../angular_test
