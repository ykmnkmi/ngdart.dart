name: _tests
description: Tests for AngularDart.

environment:
  sdk: ^3.1.5

dependencies:
  angular: ^7.1.0
  angular_compiler: ^2.1.0
  angular_test: ^4.1.0
  build: ^2.4.1
  build_resolvers: ^2.4.2
  build_test: ^2.2.2
  collection: ^1.18.0
  glob: ^2.1.2
  logging: ^1.2.0
  js: ^0.6.7
  meta: 1.9.1
  test: ^1.25.2

dev_dependencies:
  analyzer: 5.13.0
  angular_forms: ^4.1.0
  build_runner: ^2.4.9
  build_web_compilers:
  lints: ^2.1.1
  mockito: ^5.4.4
  package_config: ^2.1.0
  source_gen: ^1.5.0
  source_span: ^1.10.2
  term_glyph: ^1.2.2

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_forms:
    path: ../angular_forms
  angular_router:
    path: ../angular_router
  angular_test:
    path: ../angular_test
