name: _tests
description: Tests for AngularDart.

environment:
  sdk: ^3.5.4

dependencies:
  angular: ^7.1.0
  angular_compiler: ^2.1.0
  angular_test: ^4.1.0
  build: ^2.4.1
  build_resolvers: ^2.4.2
  build_test: ^2.2.2
  collection: ^1.19.1
  glob: ^2.1.3
  logging: ^1.3.0
  js: ^0.7.1
  meta: ^1.18.1
  test: ^1.26.3

dev_dependencies:
  analyzer: ^6.8.0
  angular_forms: ^4.1.0
  build_runner: ^2.4.13
  build_web_compilers:
  lints: ^5.0.0
  mockito: ^5.4.4
  package_config: ^2.2.0
  source_gen: ^1.5.0
  source_span: ^1.10.2
  term_glyph: ^1.2.2

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_forms:
    path: ../angular_forms
  angular_router:
    path: ../angular_router
  angular_test:
    path: ../angular_test
