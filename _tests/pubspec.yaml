name: _tests
description: Tests for AngularDart.

environment:
  sdk: 2.14.4

dependencies:
  angular: ^7.0.2
  angular_test: ^4.0.1
  build_resolvers: ^2.0.6
  collection: ^1.17.0
  meta: ">=1.9.1 <1.10.0"
  test: ^1.20.2

dev_dependencies:
  analyzer: ^2.8.0
  angular_forms: ^4.0.1
  build_runner: ^2.2.0
  build_test: ^2.1.5
  build_web_compilers:
  lints: ^1.0.1
  mockito: ^5.2.0
  package_config: ^2.1.0
  source_span: ^1.9.1
  term_glyph: ^1.2.1

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
  angular_compiler:
    path: ../angular_compiler
  angular_forms:
    path: ../angular_forms
  angular_router:
    path: ../angular_router
  angular_test:
    path: ../angular_test
